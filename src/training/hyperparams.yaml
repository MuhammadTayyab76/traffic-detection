model:
  architecture: yolov8s.pt
  pretrained: true

dataset:
  config: configs/dataset.yaml
  image_size: 640

training:
  epochs: 80
  batch_size: 16
  patience: 15
  workers: 4
  device: 0
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  cos_lr: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1

output:
  project: runs/train
  name: bdd100k_yolov8s_80ep
  save_period: 10
  weights_dir: weights