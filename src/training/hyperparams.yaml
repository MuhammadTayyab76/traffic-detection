# src/training/hyperparams.yaml

# Model
model:
  architecture: yolov8s.pt
  pretrained: true

# Dataset
dataset:
  config: configs/dataset.yaml
  image_size: 640

# Training
training:
  epochs: 80                    
  batch_size: 16               
  patience: 15      
  workers: 4
  device: 0

# Optimizer
optimizer:
  name: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3

# Augmentation
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.5
  flipud: 0.0                  # no vertical flip for traffic footage
  fliplr: 0.5
  mosaic: 0.8
  mixup: 0.1

# Output
output:
  project: runs/train
  name: bdd100k_yolov8s_80ep 
  save_period: 10 