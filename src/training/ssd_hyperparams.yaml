model:
  architecture:         ssdlite320_mobilenet_v3_large
  pretrained_backbone:  true
  num_classes:          11          # 10 traffic classes + 1 background

dataset:
  root:       data/bdd100k_voc
  image_size: 320                   # SSDLite320 native resolution

training:
  epochs:       100
  batch_size:   16                 
  lr:           0.005
  momentum:     0.9
  weight_decay: 5.0e-4
  warmup_epochs: 5                  # linear LR warmup before cosine
  patience:     25                 # early stopping on val loss
  workers:      4
  device:       0                   

output:
  project:     runs/ssd
  name:        bdd100k_ssdlite_100ep
  save_period: 10                   # save checkpoint every N epochs
  weights_dir: weights