# configs/dataset.yaml
# YOLOv8 dataset configuration for BDD100K (Roboflow v5)
# Paths are relative to the repo ROOT — always run training from repo root

path: data/bdd100k

train: train/images
val:   valid/images
test:  test/images     

nc: 12

names:
  0: bike
  1: bus
  2: car
  3: drivable area
  4: lane
  5: motor
  6: person
  7: rider
  8: traffic light
  9: traffic sign
  10: train
  11: truck