# configs/dataset.yaml
# YOLOv8 dataset configuration for BDD100K (Roboflow v5)
# Paths are relative to the repo ROOT — always run training from repo root

path: data/bdd100k

train: train/images
val:   valid/images
test:  valid/images     

nc: 10

names:
  0: bike
  1: bus
  2: car
  3: motor
  4: person
  5: rider
  6: traffic light
  7: traffic sign
  8: train
  9: truck