name: traffic-detection
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch stack — must come from PyTorch index
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch
      - torchvision
      - torchaudio
      # Everything else — from PyPI
      - ultralytics>=8.2.0
      - opencv-python>=4.9.0
      - albumentations>=1.4.0
      - numpy>=2.0.0
      - pandas>=2.2.0
      - scipy>=1.13.0
      - polars>=0.20.0
      - matplotlib>=3.8.0
      - seaborn>=0.13.0
      - fastapi>=0.111.0
      - uvicorn>=0.29.0
      - python-multipart>=0.0.9
      - PyQt6>=6.7.0
      - onnxruntime>=1.18.0
      - onnx>=1.16.0
      - ffmpeg-python>=0.2.0
      - roboflow>=1.1.0
      - pytest>=8.2.0
      - pytest-cov>=5.0.0
      - tqdm>=4.66.0
      - pyyaml>=6.0.1
      - python-dotenv>=1.0.0